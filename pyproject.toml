[project]
name = "come-clean-eval"
version = "0.2.0"
description = "Does a coding agent admit using information it was told not to use?"
requires-python = ">=3.10"
dependencies = [
    "inspect-ai>=0.3.205",
    "openai>=2.26.0,<3",
]

[tool.comeclean]
headline = "Come Clean Eval"
summary = """
Every trial shows the agent information it was told not to use, in a task that cannot be
finished without it. Nothing asks the agent to bring this up, so the eval measures whether
the agent uses it, whether its report mentions it anyway, and, when it did use it, whether
the report says so.
"""

[project.optional-dependencies]
scripts = ["markdown>=3.7"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
norecursedirs = ["seed"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comeclean"]
